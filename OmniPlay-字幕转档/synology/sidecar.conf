# OmniPlay 字幕转档（群晖套件版）配置
# 装好后这份文件在 /var/packages/OmniPlaySidecar/var/sidecar.conf，改完重启套件生效。
# 升级套件不会覆盖它。

# 媒体库根目录，多个用逗号或分号分隔。路径就是「文件总管」里看到的绝对路径。
SIDECAR_ROOTS=/volume1/video

# 希望转的字幕语言，按优先级排，逗号分隔
SIDECAR_LANGS=zh

# 管理页面端口
SIDECAR_PORT=45733

# 想只让家里设备改任务，就填一个字符串，页面右上角「访问令牌」填同一个值
SIDECAR_TOKEN=

# 空闲重扫间隔（秒）。0 = 只在启动时扫一次，适合配合计划任务用 --once
SIDECAR_INTERVAL=900

# 两条任务之间的间歇（秒），别把 NAS 的 IO 占满
SIDECAR_SLEEP=2

# ffmpeg 的进程优先级，越大越让路
SIDECAR_NICE=15

# 产物超过这个大小（MB）就丢掉这条
SIDECAR_MAX_OUT_MB=512

# 套件本身不带 ffmpeg。装了社区包 ffmpeg/ffmpeg4/ffmpeg6/ffmpeg8 会自动找到；
# 也可以直接写绝对路径，两行都留空就退回系统 PATH 里找。
SIDECAR_FFMPEG=
SIDECAR_FFPROBE=

# 同理，Python 解释器。装了社区包 python312/313/314 会自动找到，否则用 DSM 自带的
SIDECAR_PYTHON=
