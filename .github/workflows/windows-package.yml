
name: Windows 打包

# 出觅影 Windows 演示版的安装包。产物：Inno 安装包 + 便携 zip + sha256。
# 手动触发即可拿包；打 win-v* 标签时额外发 GitHub Release。
# 探针（GRDB、契约测试、libmpv 装载）在 windows-swift-spike.yml 里跑，这里只做冒烟把关。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（进安装包文件名）
        default: "0.1.0"
      configuration:
        description: 构建配置
        type: choice
        default: Release
        options:
          - Release
          - Debug
  push:
    tags:
      - "win-v*"

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

env:
  # libmpv 共享库直链，换版本只改这一行（docs/SPIKE.md 有说明）
  LIBMPV_URL: https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20240414-git-1ba6a3a.7z/download

jobs:
  package:
    name: 构建并打包
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # windows 运行器不自带 Swift，用社区装的官方发行版
      - name: 安装 Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.0.3-release
          tag: 6.0.3-RELEASE

      - name: 定版本号
        id: ver
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -like 'win-v*') { $version = $tag.Substring(5) }
          else { $version = '${{ inputs.version }}' }
          if (-not $version) { $version = '0.1.0' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "版本号：$version"

      - name: 出包
        run: ./windows/package.ps1 -Version '${{ steps.ver.outputs.version }}' -Configuration '${{ inputs.configuration }}'
        working-directory: OmniPlay-win-swift

      - name: 产物清单
        run: Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.ver.outputs.version }}
          path: |
            OmniPlay-win-swift/artifacts/*setup.exe
            OmniPlay-win-swift/artifacts/*.zip
            OmniPlay-win-swift/artifacts/*.sha256
          if-no-files-found: error

      - name: 发 GitHub Release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniPlay-win-swift/artifacts/*setup.exe
            OmniPlay-win-swift/artifacts/*.zip
            OmniPlay-win-swift/artifacts/*.sha256
